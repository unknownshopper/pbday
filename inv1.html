<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cumpleaños - 21 de Septiembre</title>
    <style>
        /* Estética minimalista, oscura e hipnótica */
        body {
            background-color: #0b0b0b;
            color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 15px;
            background: linear-gradient(145deg, #121212, #1a1a1a);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        h1 {
            color: #d4af37; /* Toque dorado elegante */
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        .fecha {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #aaa;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #d4af37;
            color: #000;
            padding: 15px;
            margin: 15px 0;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #fff;
            transform: scale(1.02);
        }
        .btn-audio {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
        }
        .playlist-box {
            margin-top: 30px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Botón de Audio Inicial (Los navegadores bloquean el autoplay, por eso se necesita este clic) -->
    <button class="btn btn-audio" id="audioBtn" onclick="toggleAudio()">🎵 Activar Música de Fondo</button>
    <audio id="bgAudio" loop>
        <!-- Reemplaza este link por tu archivo de audio (mp3) subido a tu repo o una URL externa -->
        <source src="tu-audio-de-fondo.mp3" type="audio/mpeg">
    </audio>

    <h1>Mi Cumpleaños</h1>
    <div class="fecha">21 DE SEPTIEMBRE</div>
    
    <p>Estás invitado a celebrar conmigo. Prepárate para una noche fuera de lo común.</p>

    <!-- Botón de Ubicación -->
    <!-- Cambia el link de abajo por el de tu Google Maps -->
    <a href="https://google.com" target="_blank" class="btn">📍 Ver Ubicación</a>

    <!-- Botón de Confirmación por WhatsApp -->
    <!-- Reemplaza el número (usa código de país) y el mensaje de texto -->
    <a href="https://wa.me¡Hola!%20Confirmo%20mi%20asistencia%20a%20tu%20cumple" target="_blank" class="btn">✓ Confirmar Asistencia</a>

    <!-- Breve Playlist Integrada (Ejemplo con un embed de Spotify) -->
    <div class="playlist-box">
        <p style="color: #888; font-size: 0.9rem;">Un adelanto de la vibra:</p>
        <!-- Puedes cambiar este iframe por el código embed de tu propia playlist de Spotify -->
        <iframe style="border-radius:12px" src="https://spotify.com" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
</div>

<script>
    function toggleAudio() {
        var audio = document.getElementById("bgAudio");
        var btn = document.getElementById("audioBtn");
        if (audio.paused) {
            audio.play();
            btn.innerHTML = "⏸ Pausar Música";
            btn.style.backgroundColor = "#d4af37";
            btn.style.color = "#000";
        } else {
            audio.pause();
            btn.innerHTML = "🎵 Activar Música de Fondo";
            btn.style.backgroundColor = "#222";
            btn.style.color = "#fff";
        }
    }
</script>

</body>
</html>
